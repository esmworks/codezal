packages:
  - apps/*
  - packages/*

# pnpm ayarları (pnpm 11+ bunları .npmrc'den değil buradan okur)
nodeLinker: hoisted
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
saveExact: true

# Yayınlanan hedeflerin ikilileri kurulum platformundan bağımsız indirilir. @napi-rs/canvas gibi
# paketler platform başına ayrı bir ikili getirir; yalnızca arm64 mac'te kurulunca mac x64,
# Windows ve Linux paketlerinde taranmış PDF sayfası görüntüye çevrilemiyordu. Pakete yalnızca
# hedefin işletim sistemine ait olanlar girer (apps/desktop/electron-builder.yml `files`).
supportedArchitectures:
  os:
    - darwin
    - win32
    - linux
  cpu:
    - x64
    - arm64

allowBuilds:
  node-pty: true
  electron: true
  esbuild: true
  "@biomejs/biome": true
  electron-winstaller: false
  "@google/genai": false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0

# Geçişli bağımlılıkları yamalı sürümlere sabitler (üst paketler henüz yükseltmedi).
overrides:
  "undici@>=8.0.0 <8.12.2": 8.13.1
  "undici@>=7.0.0 <7.30.1": 7.30.2
  "undici@>=6.0.0 <6.29.1": 6.29.1
  "brace-expansion@>=5.0.0 <5.0.11": 5.0.12
  "brace-expansion@>=2.0.0 <2.1.6": 2.1.8
  "brace-expansion@<1.1.20": 1.1.22
  "source-map-js@>=1.0.0 <1.2.2": 1.2.4
  "zod@>=4.0.0 <4.6.6": 4.6.7
